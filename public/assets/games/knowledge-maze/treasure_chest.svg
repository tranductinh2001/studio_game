<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%">
  <defs>
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="chestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="chestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#chestGlow)">
    <!-- Base Body -->
    <path d="M25 65 L135 65 L125 125 L35 125 Z" fill="url(#chestWood)" stroke="#292524" stroke-width="4"/>

    <!-- Gold Corner Reinforcements -->
    <path d="M25 65 L45 65 L42 125 L35 125 Z" fill="url(#chestGold)"/>
    <path d="M115 65 L135 65 L125 125 L118 125 Z" fill="url(#chestGold)"/>

    <!-- Curved Vaulted Lid -->
    <path d="M20 65 C20 30 140 30 140 65 Z" fill="url(#chestWood)" stroke="#292524" stroke-width="4"/>
    <path d="M20 65 C20 30 50 30 45 65 Z" fill="url(#chestGold)"/>
    <path d="M115 65 C110 30 140 30 140 65 Z" fill="url(#chestGold)"/>
    <rect x="72" y="32" width="16" height="34" fill="url(#chestGold)"/>

    <!-- Golden Lock Keyhole -->
    <rect x="68" y="60" width="24" height="28" rx="4" fill="url(#chestGold)" stroke="#854d0e" stroke-width="2.5"/>
    <circle cx="80" cy="72" r="4" fill="#292524"/>
    <polygon points="78,74 82,74 84,82 76,82" fill="#292524"/>

    <!-- Sparkles -->
    <polygon points="135,25 137,31 143,32 137,34 135,40 133,34 127,32 133,31" fill="#fef08a"/>
    <polygon points="25,45 27,50 32,51 27,53 25,58 23,53 18,51 23,50" fill="#fef08a"/>
  </g>
</svg>
