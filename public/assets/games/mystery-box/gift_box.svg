<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="75" ry="16" fill="#0f172a" opacity="0.3"/>

  <g filter="url(#boxShadow)">
    <!-- Box Body -->
    <rect x="35" y="80" width="130" height="95" rx="10" fill="url(#boxFront)" stroke="#0369a1" stroke-width="4"/>

    <!-- Vertical Ribbon on Body -->
    <rect x="85" y="80" width="30" height="95" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="2"/>

    <!-- Horizontal Ribbon on Body -->
    <rect x="35" y="118" width="130" height="24" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="2"/>

    <!-- Box Lid (Slightly wider) -->
    <rect x="25" y="55" width="150" height="30" rx="6" fill="url(#boxTop)" stroke="#0369a1" stroke-width="4"/>

    <!-- Ribbon on Lid -->
    <rect x="85" y="55" width="30" height="30" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="2"/>

    <!-- Fluffy 3D Ribbon Bow -->
    <!-- Left Loop -->
    <path d="M100 56 C75 25 45 35 60 55 C70 65 95 60 100 56 Z" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="3"/>
    <ellipse cx="70" cy="45" rx="8" ry="5" fill="#fef08a" opacity="0.6"/>

    <!-- Right Loop -->
    <path d="M100 56 C125 25 155 35 140 55 C130 65 105 60 100 56 Z" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="3"/>
    <ellipse cx="130" cy="45" rx="8" ry="5" fill="#fef08a" opacity="0.6"/>

    <!-- Ribbon Knot Center -->
    <circle cx="100" cy="56" r="12" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="3"/>
    <circle cx="97" cy="53" r="4" fill="#fef08a"/>

    <!-- Sparkling Stars -->
    <polygon points="160,40 163,48 171,51 163,54 160,62 157,54 149,51 157,48" fill="#fef08a"/>
    <polygon points="35,100 37,105 42,107 37,109 35,114 33,109 28,107 33,105" fill="#fef08a"/>
  </g>
</svg>
