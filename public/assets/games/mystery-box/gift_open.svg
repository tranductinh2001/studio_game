<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="boxInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="lightBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Radiant Light Rays Shooting Out -->
  <g opacity="0.85">
    <circle cx="100" cy="80" r="75" fill="url(#lightBurst)"/>
    <polygon points="100,80 70,10 85,8 100,80" fill="#fef08a" opacity="0.6"/>
    <polygon points="100,80 115,8 130,10 100,80" fill="#fef08a" opacity="0.6"/>
    <polygon points="100,80 35,35 45,25 100,80" fill="#fef08a" opacity="0.6"/>
    <polygon points="100,80 155,25 165,35 100,80" fill="#fef08a" opacity="0.6"/>
  </g>

  <!-- Flying Sparkles & Confetti -->
  <g>
    <polygon points="100,20 103,28 111,30 103,32 100,40 97,32 89,30 97,28" fill="#fef08a"/>
    <polygon points="55,45 57,51 63,52 57,54 55,60 53,54 47,52 53,51" fill="#f43f5e"/>
    <polygon points="145,45 147,51 153,52 147,54 145,60 143,54 137,52 143,51" fill="#38bdf8"/>
    <circle cx="75" cy="30" r="4" fill="#a855f7"/>
    <circle cx="125" cy="30" r="4" fill="#22c55e"/>
  </g>

  <!-- Open Lid Flying / Tilted to Upper Left -->
  <g transform="translate(15, 10) rotate(-22)" filter="url(#boxShadow)">
    <rect x="10" y="25" width="130" height="24" rx="5" fill="#7dd3fc" stroke="#0369a1" stroke-width="3"/>
    <rect x="65" y="25" width="22" height="24" fill="url(#goldRibbon)"/>
    <!-- Ribbon bow tilted -->
    <path d="M76 25 C55 5 35 15 48 28 C56 34 72 30 76 25 Z" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="2"/>
    <path d="M76 25 C97 5 117 15 104 28 C96 34 80 30 76 25 Z" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="2"/>
    <circle cx="76" cy="25" r="8" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="2"/>
  </g>

  <!-- Lower Box Open Base -->
  <g filter="url(#boxShadow)">
    <!-- Inner Cavity with Gold Flare -->
    <ellipse cx="100" cy="85" rx="60" ry="18" fill="url(#boxInner)" stroke="#b45309" stroke-width="3"/>

    <!-- Front Box Wall -->
    <path d="M35 85 L35 170 C35 176 40 180 46 180 L154 180 C160 180 165 176 165 170 L165 85 C140 100 60 100 35 85 Z" fill="url(#boxFront)" stroke="#0369a1" stroke-width="4"/>

    <!-- Front Vertical Ribbon -->
    <path d="M85 96 L85 180 L115 180 L115 96 C105 98 95 98 85 96 Z" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="2"/>
  </g>
</svg>