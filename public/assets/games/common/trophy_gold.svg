<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cupInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Star sparkles background -->
  <g opacity="0.85">
    <path d="M100 8 L103 20 L115 23 L103 26 L100 38 L97 26 L85 23 L97 20 Z" fill="#fef08a" filter="url(#glow)"/>
    <path d="M40 45 L42 53 L50 55 L42 57 L40 65 L38 57 L30 55 L38 53 Z" fill="#fef08a"/>
    <path d="M160 45 L162 53 L170 55 L162 57 L160 65 L158 57 L150 55 L158 53 Z" fill="#fef08a"/>
  </g>

  <!-- Handles -->
  <g filter="url(#shadow)">
    <path d="M56 64 C30 64 24 105 52 116 C55 117 62 113 60 106 C42 98 46 76 62 76 Z" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="3"/>
    <path d="M144 64 C170 64 176 105 148 116 C145 117 138 113 140 106 C158 98 154 76 138 76 Z" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="3"/>
  </g>

  <!-- Cup Body -->
  <g filter="url(#shadow)">
    <!-- Base stand -->
    <path d="M72 155 L128 155 L122 170 L78 170 Z" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="2.5"/>
    <rect x="64" y="168" width="72" height="18" rx="4" fill="url(#woodBase)" stroke="#1e1b4b" stroke-width="3"/>
    <rect x="74" y="172" width="52" height="10" rx="2" fill="#fef08a" opacity="0.9"/>
    <text x="100" y="180" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="#78350f" text-anchor="middle" letter-spacing="1">QUÁN QUÂN</text>

    <!-- Stem -->
    <path d="M92 124 L108 124 L105 155 L95 155 Z" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="2.5"/>

    <!-- Bowl -->
    <path d="M58 52 C58 95 80 126 100 126 C120 126 142 95 142 52 Z" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="3.5"/>
    <!-- Inner depth ellipse -->
    <ellipse cx="100" cy="52" rx="42" ry="10" fill="url(#cupInner)" stroke="#854d0e" stroke-width="3"/>

    <!-- Front Star Emblem -->
    <circle cx="100" cy="85" r="16" fill="#ca8a04" stroke="#fef08a" stroke-width="2.5"/>
    <path d="M100 73 L104 81 L113 82 L106 88 L108 97 L100 92 L92 97 L94 88 L87 82 L96 81 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Highlights -->
    <path d="M68 62 C68 85 80 108 92 116 C84 108 76 90 76 65 Z" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>