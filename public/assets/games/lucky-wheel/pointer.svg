<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="rubyGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="needleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#needleShadow)">
    <!-- Main Golden Triangular Pointer Pointing DOWN -->
    <path d="M50 115 L22 30 C20 18 32 8 50 8 C68 8 80 18 78 30 Z" fill="url(#goldNeedle)" stroke="#854d0e" stroke-width="4"/>

    <!-- Inner Highlight -->
    <path d="M50 102 L30 30 C29 22 38 15 50 15 C62 15 71 22 70 30 Z" fill="#ffffff" opacity="0.3"/>

    <!-- Center Ruby Gem Pivot -->
    <circle cx="50" cy="35" r="18" fill="url(#rubyGem)" stroke="#fff" stroke-width="3"/>
    <circle cx="45" cy="30" r="5" fill="#ffffff" opacity="0.7"/>

    <!-- Pointer Tip Accent -->
    <polygon points="50,112 44,90 56,90" fill="#fef08a"/>
  </g>
</svg>