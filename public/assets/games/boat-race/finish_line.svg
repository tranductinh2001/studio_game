<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 700" width="100%" height="100%">
  <defs>
    <filter id="buoyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="poleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Checkered Finish Banner Line Vertical -->
  <line x1="60" y1="20" x2="60" y2="660" stroke="#f8fafc" stroke-width="8" stroke-dasharray="14 14" opacity="0.9" />
  <line x1="60" y1="27" x2="60" y2="667" stroke="#0f172a" stroke-width="8" stroke-dasharray="14 14" opacity="0.9" />

  <!-- Top Floating Beacon Buoy -->
  <g filter="url(#buoyShadow)">
    <ellipse cx="60" cy="40" rx="36" ry="12" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <ellipse cx="60" cy="35" rx="26" ry="8" fill="#f87171"/>
    <!-- Flag Pole -->
    <rect x="57" y="10" width="6" height="30" fill="url(#poleMetal)"/>
    <!-- Checkered Flag -->
    <g transform="translate(63, 5)">
      <rect x="0" y="0" width="36" height="24" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="0" y="0" width="12" height="12" fill="#0f172a"/>
      <rect x="24" y="0" width="12" height="12" fill="#0f172a"/>
      <rect x="12" y="12" width="12" height="12" fill="#0f172a"/>
    </g>
  </g>

  <!-- Mid Water Buoy -->
  <g filter="url(#buoyShadow)">
    <circle cx="60" cy="350" r="18" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <circle cx="60" cy="350" r="10" fill="#fef08a"/>
    <text x="60" y="354" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#78350f" text-anchor="middle">ĐÍCH</text>
  </g>

  <!-- Bottom Buoy -->
  <g filter="url(#buoyShadow)">
    <ellipse cx="60" cy="650" rx="40" ry="14" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <ellipse cx="60" cy="645" rx="30" ry="9" fill="#f87171"/>
    <rect x="57" y="610" width="6" height="40" fill="url(#poleMetal)"/>
    <g transform="translate(63, 605)">
      <rect x="0" y="0" width="36" height="24" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="0" y="0" width="12" height="12" fill="#0f172a"/>
      <rect x="24" y="0" width="12" height="12" fill="#0f172a"/>
      <rect x="12" y="12" width="12" height="12" fill="#0f172a"/>
    </g>
  </g>
</svg>
