<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="targetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#targetShadow)">
    <!-- Outer Ring (10 PTS) -->
    <circle cx="80" cy="80" r="70" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <text x="80" y="24" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#0f172a" text-anchor="middle">10</text>

    <!-- Ring 2 (20 PTS) -->
    <circle cx="80" cy="80" r="54" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
    <text x="80" y="38" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">20</text>

    <!-- Ring 3 (50 PTS) -->
    <circle cx="80" cy="80" r="38" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <text x="80" y="52" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">50</text>

    <!-- Bullseye Gold (100 PTS) -->
    <circle cx="80" cy="80" r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <text x="80" y="85" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#78350f" text-anchor="middle">100</text>

    <!-- Sparkle Stars -->
    <polygon points="80,10 82,14 86,15 82,16 80,20 78,16 74,15 78,14" fill="#fef08a"/>
  </g>
</svg>