<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cannonBrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="carriageWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <filter id="cannonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#cannonShadow)">
    <!-- Wooden Carriage Frame -->
    <path d="M30 85 L100 85 L90 55 L45 55 Z" fill="url(#carriageWood)" stroke="#1c1917" stroke-width="3"/>

    <!-- Brass Cannon Barrel Elevated ~35 degrees -->
    <g transform="translate(60, 60) rotate(-32) translate(-50, -20)">
      <!-- Barrel Base Bulb -->
      <circle cx="20" cy="20" r="18" fill="url(#cannonBrass)" stroke="#78350f" stroke-width="3"/>
      <!-- Main Barrel Cylinder -->
      <path d="M20 5 L110 12 L110 28 L20 35 Z" fill="url(#cannonBrass)" stroke="#78350f" stroke-width="3"/>
      <!-- Barrel Rings -->
      <rect x="50" y="7" width="8" height="26" rx="2" fill="#fef08a" stroke="#854d0e" stroke-width="1.5"/>
      <rect x="85" y="10" width="8" height="20" rx="2" fill="#fef08a" stroke="#854d0e" stroke-width="1.5"/>
      <!-- Muzzle Ring -->
      <ellipse cx="110" cy="20" rx="6" ry="10" fill="url(#cannonBrass)" stroke="#78350f" stroke-width="3"/>
      <ellipse cx="112" cy="20" rx="4" ry="7" fill="#1c1917"/>
    </g>

    <!-- Heavy Spoke Wheel -->
    <circle cx="65" cy="85" r="28" fill="url(#carriageWood)" stroke="#1c1917" stroke-width="4"/>
    <circle cx="65" cy="85" r="22" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <!-- Wheel Spokes -->
    <line x1="65" y1="63" x2="65" y2="107" stroke="#451a03" stroke-width="3.5"/>
    <line x1="43" y1="85" x2="87" y2="85" stroke="#451a03" stroke-width="3.5"/>
    <line x1="49" y1="69" x2="81" y2="101" stroke="#451a03" stroke-width="3.5"/>
    <line x1="49" y1="101" x2="81" y2="69" stroke="#451a03" stroke-width="3.5"/>
    <!-- Iron Wheel Hub -->
    <circle cx="65" cy="85" r="9" fill="#1c1917" stroke="#f8fafc" stroke-width="1.5"/>
  </g>
</svg>
