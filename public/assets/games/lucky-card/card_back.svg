<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cardHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="35%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#cardShadow)">
    <!-- Card Base Rounded -->
    <rect x="10" y="10" width="220" height="320" rx="18" fill="url(#cardHolo)" stroke="url(#goldBorder)" stroke-width="6"/>

    <!-- Inner Golden Frame -->
    <rect x="22" y="22" width="196" height="296" rx="12" fill="none" stroke="url(#goldBorder)" stroke-width="2.5" stroke-dasharray="8 4"/>

    <!-- Corner Ornaments -->
    <polygon points="26,26 40,26 26,40" fill="url(#goldBorder)"/>
    <polygon points="214,26 200,26 214,40" fill="url(#goldBorder)"/>
    <polygon points="26,314 40,314 26,300" fill="url(#goldBorder)"/>
    <polygon points="214,314 200,314 214,300" fill="url(#goldBorder)"/>

    <!-- Center Emblem Diamond & Star -->
    <polygon points="120,90 180,170 120,250 60,170" fill="#312e81" stroke="url(#goldBorder)" stroke-width="3" opacity="0.85"/>
    <circle cx="120" cy="170" r="32" fill="#4338ca" stroke="#fef08a" stroke-width="3"/>
    
    <!-- Big Golden Question Mark / Magic Star -->
    <text x="120" y="185" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#fef08a" text-anchor="middle" filter="drop-shadow(0 2px 4px #000)">?</text>

    <!-- Radiating Ray Accents -->
    <line x1="120" y1="126" x2="120" y2="105" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="214" x2="120" y2="235" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <line x1="76" y1="170" x2="55" y2="170" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <line x1="164" y1="170" x2="185" y2="170" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>

    <!-- Card Brand Text -->
    <text x="120" y="295" font-family="Arial, sans-serif" font-weight="800" font-size="10" fill="#fef08a" text-anchor="middle" letter-spacing="2">THCS ĐẮK TRÔI • 6A</text>
  </g>
</svg>